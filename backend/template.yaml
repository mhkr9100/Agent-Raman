AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RamN AI Backend - Auth, DB, Proxy, Tools, Memory

Parameters:
  GcpServiceAccountKey:
    Type: String
    Description: GCP Service Account JSON key for Vertex AI authentication
    Default: '{"private_key":"","client_email":""}'
    NoEcho: true
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID
    Default: 'us-east-1_R2j2oAqLJ'
  ClientId:
    Type: String
    Description: Cognito App Client ID
    Default: '77205lmtu8fg6t1s3sgcidf7p9'
  GoogleSearchApiKey:
    Type: String
    Description: Google Custom Search API Key for agent searching
    NoEcho: true
  GoogleCseId:
    Type: String
    Description: Google Custom Search Engine ID
  CorsAllowOrigin:
    Type: String
    Description: Primary allowed frontend origin for API Gateway CORS
    Default: 'https://www.ramnai.com'
  AllowedOrigins:
    Type: String
    Description: Comma-separated allowed origins used by Lambda CORS checks
    Default: 'https://www.ramnai.com,http://localhost:3000,http://localhost:5173'
  S3BucketName:
    Type: String
    Description: S3 bucket used for knowledge uploads
    Default: 'ramn-ai-agent-knowledge-base'
  S3BucketRegion:
    Type: String
    Description: AWS region where the S3 knowledge bucket exists
    Default: 'us-east-2'

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref EntitiesTable
        USER_POOL_ID: !Ref UserPoolId
        CLIENT_ID: !Ref ClientId
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        S3_BUCKET_NAME: !Ref S3BucketName
        S3_BUCKET_REGION: !Ref S3BucketRegion
        USAGE_TABLE_NAME: !Ref UsageTable
  Api:
    Cors:
      AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
      AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
      AllowOrigin: !Sub "'${CorsAllowOrigin}'"

Resources:
  # ──── DynamoDB Table ────
  EntitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RamN-Entities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RamN_Documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: docId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: ownerKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: docId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ownerKey-createdAt-index
          KeySchema:
            - AttributeName: ownerKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RamN_Teams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RamN_Usage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: usageKey
          AttributeType: S
      KeySchema:
        - AttributeName: usageKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ──── Secrets Manager ────
  GcpServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "RamNGcpKey-${AWS::StackName}"
      Description: "GCP Service Account Key for Vertex AI"
      SecretString: !Ref GcpServiceAccountKey

  # ──── Lambda Functions ────


  DbFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/db.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitiesTable
      Events:
        DbPost:
          Type: Api
          Properties:
            Path: /api/db
            Method: POST
        DbGet:
          Type: Api
          Properties:
            Path: /api/db
            Method: GET
        DbDelete:
          Type: Api
          Properties:
            Path: /api/db
            Method: DELETE
        DbOptions:
          Type: Api
          Properties:
            Path: /api/db
            Method: OPTIONS

  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/uploads.handler
      CodeUri: .
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${S3BucketName}/knowledge-base/*"
      Events:
        UploadPresign:
          Type: Api
          Properties:
            Path: /api/uploads/presign
            Method: POST
        UploadPresignOptions:
          Type: Api
          Properties:
            Path: /api/uploads/presign
            Method: OPTIONS

  ProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/proxy.handler
      CodeUri: .
      Events:
        ProxyPost:
          Type: Api
          Properties:
            Path: /api/proxy
            Method: POST
        ProxyOptions:
          Type: Api
          Properties:
            Path: /api/proxy
            Method: OPTIONS

  ToolsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/tools.handler
      CodeUri: .
      Events:
        ToolsGet:
          Type: Api
          Properties:
            Path: /api/tools
            Method: GET
        ToolsOptions:
          Type: Api
          Properties:
            Path: /api/tools
            Method: OPTIONS

  MemoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/memory.handler
      CodeUri: .
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref EntitiesTable
          GCP_PROJECT_ID: ramn-ai
          GCP_LOCATION: us-central1
          GCP_SERVICE_ACCOUNT_SECRET_ARN: !Ref GcpServiceAccountSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitiesTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpServiceAccountSecret
      Events:
        MemoryAdd:
          Type: Api
          Properties:
            Path: /api/memory/add
            Method: POST
        MemorySearch:
          Type: Api
          Properties:
            Path: /api/memory/search
            Method: POST
        MemoryList:
          Type: Api
          Properties:
            Path: /api/memory/list
            Method: GET
        MemoryOptions:
          Type: Api
          Properties:
            Path: /api/memory/{proxy+}
            Method: OPTIONS

  # ──── AI Proxy (Vertex AI only) ────
  AIProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/ai-proxy.handler
      CodeUri: .
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          GCP_PROJECT_ID: ramn-ai
          GCP_LOCATION: us-central1
          GCP_SERVICE_ACCOUNT_SECRET_ARN: !Ref GcpServiceAccountSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpServiceAccountSecret
      Events:
        AIGenerate:
          Type: Api
          Properties:
            Path: /api/ai/generate
            Method: POST
        AIHealth:
          Type: Api
          Properties:
            Path: /api/ai/health
            Method: GET
        AIOptions:
          Type: Api
          Properties:
            Path: /api/ai/{proxy+}
            Method: OPTIONS

  # ══════════════════════════════════════════════════════════════
  #  V2 API — New Backend Architecture (Phase 1)
  #  All routes use /api/v2/ prefix for safe migration
  # ══════════════════════════════════════════════════════════════

  # ──── Prism Chat (Meta Agent Brain) ────
  PrismChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/prism-chat/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          GCP_PROJECT_ID: ramn-ai
          GCP_LOCATION: us-central1
          GCP_SERVICE_ACCOUNT_SECRET_ARN: !Ref GcpServiceAccountSecret
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*/index/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpServiceAccountSecret
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${S3BucketName}/knowledge-base/*"
      Events:
        PrismChat:
          Type: Api
          Properties:
            Path: /api/v2/prism/chat
            Method: POST
        PrismChatStream:
          Type: Api
          Properties:
            Path: /api/v2/prism/chat/stream
            Method: POST
        PrismChatOptions:
          Type: Api
          Properties:
            Path: /api/v2/prism/chat
            Method: OPTIONS
        PrismChatStreamOptions:
          Type: Api
          Properties:
            Path: /api/v2/prism/chat/stream
            Method: OPTIONS

  # ──── Agent Create (Blueprint Saver) ────
  AgentCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/agent-create/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*/index/*"
      Events:
        AgentCreate:
          Type: Api
          Properties:
            Path: /api/v2/agents/create
            Method: POST
        AgentCreateOptions:
          Type: Api
          Properties:
            Path: /api/v2/agents/create
            Method: OPTIONS

  # ──── Agent Run (Agent Runtime) ────
  AgentRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/agent-run/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          GCP_PROJECT_ID: ramn-ai
          GCP_LOCATION: us-central1
          GCP_SERVICE_ACCOUNT_SECRET_ARN: !Ref GcpServiceAccountSecret
          TABLE_PREFIX: 'RamN_'
          GOOGLE_SEARCH_API_KEY: !Ref GoogleSearchApiKey
          GOOGLE_CSE_ID: !Ref GoogleCseId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*/index/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_UserMap'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Documents'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Documents/index/*'
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${S3BucketName}/knowledge-base/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpServiceAccountSecret
      Events:
        AgentRun:
          Type: Api
          Properties:
            Path: /api/v2/agents/{agentId}/chat
            Method: POST
        AgentRunOptions:
          Type: Api
          Properties:
            Path: /api/v2/agents/{agentId}/chat
            Method: OPTIONS

  # ──── Agent List (Read-Only) ────
  AgentListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/agent-list/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*/index/*"
      Events:
        AgentList:
          Type: Api
          Properties:
            Path: /api/v2/agents
            Method: GET
        AgentListOptions:
          Type: Api
          Properties:
            Path: /api/v2/agents
            Method: OPTIONS

  # ──── Team APIs ────
  TeamListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/team-list/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Teams"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Teams/index/*"
      Events:
        TeamList:
          Type: Api
          Properties:
            Path: /api/v2/teams
            Method: GET
        TeamListOptions:
          Type: Api
          Properties:
            Path: /api/v2/teams
            Method: OPTIONS

  TeamUpsertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/team-upsert/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Teams"
      Events:
        TeamUpsert:
          Type: Api
          Properties:
            Path: /api/v2/teams
            Method: POST

  TeamDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/team-delete/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Teams"
      Events:
        TeamDelete:
          Type: Api
          Properties:
            Path: /api/v2/teams/{teamId}
            Method: DELETE
        TeamDeleteOptions:
          Type: Api
          Properties:
            Path: /api/v2/teams/{teamId}
            Method: OPTIONS

  TeamFabricateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/team-fabricate/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Agents"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_Teams"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_UserMap"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_ToolRegistry"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_ModelRegistry"
      Events:
        TeamFabricate:
          Type: Api
          Properties:
            Path: /api/v2/teams/fabricate
            Method: POST
        TeamFabricateOptions:
          Type: Api
          Properties:
            Path: /api/v2/teams/fabricate
            Method: OPTIONS

  # ──── Agent Delete ────
  AgentDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/agent-delete/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*/index/*"
      Events:
        AgentDelete:
          Type: Api
          Properties:
            Path: /api/v2/agents/{agentId}
            Method: DELETE
        AgentDeleteOptions:
          Type: Api
          Properties:
            Path: /api/v2/agents/{agentId}
            Method: OPTIONS

  # ──── Model Registry V2 (Read-Only) ────
  ModelRegistryV2Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/model-registry/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
      Events:
        ModelRegistryV2:
          Type: Api
          Properties:
            Path: /api/v2/models
            Method: GET
        ModelRegistryV2Options:
          Type: Api
          Properties:
            Path: /api/v2/models
            Method: OPTIONS

  # ──── Tool Registry V2 (Read-Only) ────
  ToolRegistryV2Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/tool-registry/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
      Events:
        ToolRegistryV2:
          Type: Api
          Properties:
            Path: /api/v2/tools
            Method: GET
        ToolRegistryV2Options:
          Type: Api
          Properties:
            Path: /api/v2/tools
            Method: OPTIONS

  # ──── Special Agents (Read-Only) ────
  SpecialAgentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/special-agents/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
      Events:
        SpecialAgents:
          Type: Api
          Properties:
            Path: /api/v2/special-agents
            Method: GET
        SpecialAgentsOptions:
          Type: Api
          Properties:
            Path: /api/v2/special-agents
            Method: OPTIONS

  # ──── UserMap Consolidate ────
  UserMapStoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/usermap-store/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
      Events:
        UserMapGet:
          Type: Api
          Properties:
            Path: /api/v2/usermap
            Method: GET
        UserMapPost:
          Type: Api
          Properties:
            Path: /api/v2/usermap
            Method: POST
        UserMapOptions:
          Type: Api
          Properties:
            Path: /api/v2/usermap
            Method: OPTIONS

  UserMapConsolidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/usermap-consolidate/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          GCP_PROJECT_ID: ramn-ai
          GCP_LOCATION: us-central1
          GCP_SERVICE_ACCOUNT_SECRET_ARN: !Ref GcpServiceAccountSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpServiceAccountSecret
      Events:
        Consolidate:
          Type: Api
          Properties:
            Path: /api/v2/usermap/consolidate
            Method: POST
        ConsolidateOptions:
          Type: Api
          Properties:
            Path: /api/v2/usermap/consolidate
            Method: OPTIONS

  DocumentsRegistryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/documents/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          TABLE_PREFIX: 'RamN_'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RamN_*/index/*"
      Events:
        DocumentsRegister:
          Type: Api
          Properties:
            Path: /api/v2/documents/register
            Method: POST
        DocumentsList:
          Type: Api
          Properties:
            Path: /api/v2/documents
            Method: GET
        DocumentsDelete:
          Type: Api
          Properties:
            Path: /api/v2/documents/{docId}
            Method: DELETE
        DocumentsRegisterOptions:
          Type: Api
          Properties:
            Path: /api/v2/documents/register
            Method: OPTIONS
        DocumentsListOptions:
          Type: Api
          Properties:
            Path: /api/v2/documents
            Method: OPTIONS
        DocumentsDeleteOptions:
          Type: Api
          Properties:
            Path: /api/v2/documents/{docId}
            Method: OPTIONS

  MemoryExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/memory-extract/index.handler
      CodeUri: .
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          GCP_PROJECT_ID: ramn-ai
          GCP_LOCATION: us-central1
          GCP_SERVICE_ACCOUNT_SECRET_ARN: !Ref GcpServiceAccountSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpServiceAccountSecret
      Events:
        Extract:
          Type: Api
          Properties:
            Path: /api/v2/memory/extract
            Method: POST
        ExtractOptions:
          Type: Api
          Properties:
            Path: /api/v2/memory/extract
            Method: OPTIONS

  ApiGatewayDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ServerlessRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"

  ApiGatewayDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ServerlessRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"

  # ──── API Gateway Usage Plan (Cloud Protection) ────
  RamNUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub "RamNUsagePlan-${AWS::StackName}"
      Description: "Protect RamN Backend from DDOS loops or accidental infinite loops"
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: Prod
      Quota:
        Limit: 100000
        Period: MONTH
      Throttle:
        BurstLimit: 50
        RateLimit: 20

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Description: DynamoDB Table
    Value: !Ref EntitiesTable
  PrismChatUrl:
    Description: Prism Chat V2 API Endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/v2/prism/chat"
