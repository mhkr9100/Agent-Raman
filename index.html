<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RamN AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Blocking script to prevent FOUC
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme', 'dark'); // Set default if null
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          fontSize: {
            'xs': '0.7rem',
            'sm': '0.8rem',
            'base': '0.875rem',
            'lg': '1rem',
            'xl': '1.125rem',
            '2xl': '1.25rem'
          },
          colors: {
            border: "rgba(255, 255, 255, 0.12)",
            input: "rgba(255, 255, 255, 0.05)",
            background: "#1A1A1A",
            foreground: "#FFFFFF",
            accent: {
              cyan: "#22D3EE",
              indigo: "#818CF8",
              purple: "#A855F7",
              pink: "#D946EF"
            }
          },
          spacing: {
            '1.5': '0.375rem',
            '4.5': '1.125rem'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      /* Dynamic color scheme based on user preference or dark class */
      color-scheme: light dark;
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Target specific scrollbars based on theme */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.5);
      border-radius: 10px;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }

    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dark .glass {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button,
    input,
    textarea,
    select {
      font-size: 0.875rem;
    }

    .btn-compact {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
    }

    /* Enhanced visibility for text - Brightened by ~10% for dark mode */
    .dark .text-slate-500 {
      color: #B4B4B4 !important;
    }

    .dark .text-slate-400 {
      color: #E1E1E4 !important;
    }

    .dark .text-slate-300 {
      color: #F2F2F5 !important;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-[#F8F9FA] text-[#1A1A1A] dark:bg-[#1A1A1A] dark:text-[#FFFFFF] transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
